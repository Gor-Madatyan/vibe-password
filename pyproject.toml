[project]
name = "vibe-password"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gor Madatyan", email = "gor-madatyan@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
vibe-password = "vibe_password:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "vibe_password.main:app"
